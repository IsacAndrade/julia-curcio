<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>Chave · Júlia Curcio</title>
    <link rel="icon" href="selo.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Poppins:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/estilo.css" />
  </head>
  <body>
    <main class="acesso">
      <form id="entrar" class="campos cartao-acesso" autocomplete="off">
        <label>Chave
          <input
            id="chave"
            name="acesso"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="off"
            spellcheck="false"
            data-lpignore="true"
            data-1p-ignore="true"
            readonly
            required
          />
        </label>
        <p id="erro" class="erro"></p>
        <button class="botao" type="submit">Entrar</button>
      </form>
    </main>
    <script type="module" src="js/login.js"></script>
  </body>
</html>
